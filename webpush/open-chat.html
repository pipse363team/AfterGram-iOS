<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191f">
  <title>Open chat in AfterGram</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111319; color: #f4f4f5; font: 17px system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(100%, 34rem); padding: 2rem; }
    a { color: #8bb8ff; }
    #open { display: inline-block; margin: 1rem 0; padding: .8rem 1rem; border-radius: .7rem; background: #315fba; color: white; text-decoration: none; }
  </style>
  <script src="./open-chat.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Opening chat in AfterGram…</h1>
    <p id="hint">If AfterGram does not open, use the button below.</p>
    <a id="open" href="#">Open chat in AfterGram</a>
    <p><a href="./">Back to notification settings</a></p>
  </main>
</body>
</html>
