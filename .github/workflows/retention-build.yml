name: Telegram 13.0 with retained messages

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run retention tests before building
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      RETENTION_RUN_TESTS: ${{ inputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch upstream submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/AfterGramBazel
            ~/Library/Caches/AfterGramRepositories
            build-input/python-ios.tar.gz
            build-input/python-packages
          key: aftergram-macos26-${{ hashFiles('versions.json', 'MODULE.bazel') }}-${{ github.run_id }}
          restore-keys: |
            aftergram-macos26-${{ hashFiles('versions.json', 'MODULE.bazel') }}-
      - name: Prepare Python runtime and test SDK
        run: bash scripts/build-retention.sh prepare
      - name: Run iOS retention and plugin tests
        run: bash scripts/build-retention.sh test
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterGram-iOS-test-results
          path: |
            bazel-testlogs/submodules/TelegramCore/**/test.log
            bazel-testlogs/submodules/TelegramCore/**/test.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build IPA
        run: bash scripts/build-retention.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramRetention-13.0
          path: build/artifacts/TelegramRetention.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish latest IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "AfterGram iOS — latest" --notes "Latest AfterGram iOS build. Download the IPA and sign it with your Apple account before installing."
          gh release upload latest build/artifacts/TelegramRetention.ipa --repo "$GITHUB_REPOSITORY" --clobber
